name: MGM Daily Status Report

on:
  # Mon–Fri only. GitHub runs scheduled workflows in UTC on the default branch.
  # Avoid minute 0 — GitHub warns the start of each hour is high-load and jobs can be delayed/dropped.
  schedule:
    - cron: '23 13 * * 1-5'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      send_now:
        description: 'Send report immediately'
        required: false
        default: 'true'

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # v5+ / v6+ use Node 24 (Node 20 action runtime deprecated on GitHub-hosted runners)
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Preflight checks
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
        run: |
          python --version
          if [ ! -f send_reports.py ]; then
            echo "::error::send_reports.py not found"
            exit 1
          fi
          if [ ! -f subscribers.json ]; then
            echo "::warning::subscribers.json not found (report may have no recipients)"
          fi
          if [ -z "$WEBEX_BOT_TOKEN" ]; then
            echo "::error::Missing required secret: WEBEX_BOT_TOKEN"
            exit 1
          fi
      
      - name: Analyze recordings (writes insights for the report)
        env:
          WEBEX_ACCESS_TOKEN: ${{ secrets.WEBEX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
          CREATE_ASANA_TASKS: ${{ vars.CREATE_ASANA_TASKS }}
        run: |
          if [ -n "$WEBEX_ACCESS_TOKEN" ] && { [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; then
            python webex_recordings.py --days 7 --output recordings_insights.md
          else
            echo "WEBEX_ACCESS_TOKEN missing, or neither OPENAI_API_KEY nor ANTHROPIC_API_KEY set — skipping live insights"
            echo "(Report will still send using the static template.)"
          fi
        continue-on-error: true
      
      - name: Send status report to subscribers
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          RECORDINGS_INSIGHTS_PATH: recordings_insights.md
        run: |
          set -euo pipefail
          python -u send_reports.py 2>&1 | tee send_report.log

      - name: Upload send-report log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: send-report-log
          path: send_report.log
      
      - name: Log completion
        run: |
          echo "✅ MGM Status Report sent at $(date)"
          echo "Subscribers notified from subscribers.json"
