name: Deploy Project Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tools/project-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-dashboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/project-dashboard/package-lock.json
      - run: npm ci
        working-directory: tools/project-dashboard
      - run: npm run build
        working-directory: tools/project-dashboard
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/project-dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
