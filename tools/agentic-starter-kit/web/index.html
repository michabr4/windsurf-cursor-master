<!doctype html>
<html lang="en" data-layout="1" data-color="1">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe Agentic Template — Guided Start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!--
      STYLE CATALOG
      =============
      Set BOTH attributes on <html> to combine layout and color freely.
        data-layout="1..10"   data-color="1..10"

      LAYOUTS                       COLORS
      1  Wizard          centered   1  Cisco Homepage   navy hero
      2  Sidebar Nav     left rail  2  Dark Mode        slate + blue
      3  Fullscreen      immersive  3  Cisco Green      green tint
      4  Timeline        stepped    4  Warm Paper       cream + teal
      5  Terminal        CLI look   5  Midnight Navy    deep navy + cyan
      6  Dashboard       dense app  6  Slate            steel + blue
      7  Card Stream     card flow  7  Webex Purple     dark purple
      8  Spotlight       big focus  8  Minimal Light    white flat
      9  Newspaper       editorial  9  High Contrast    red borders
      10 Command Palette launcher   10 Cisco Sunset     coral + blue
    -->

    <!-- Style panel — two rows of chips -->
    <div class="style-panel" role="region" aria-label="Visual style controls">
      <div class="style-panel-row">
        <span class="style-panel-label">Layout</span>
        <div class="style-chips">
          <button class="style-chip layout-chip" data-layout-id="1">1 Wizard</button>
          <button class="style-chip layout-chip" data-layout-id="2">2 Sidebar</button>
          <button class="style-chip layout-chip" data-layout-id="3">3 Fullscreen</button>
          <button class="style-chip layout-chip" data-layout-id="4">4 Timeline</button>
          <button class="style-chip layout-chip" data-layout-id="5">5 Terminal</button>
          <button class="style-chip layout-chip" data-layout-id="6">6 Dashboard</button>
          <button class="style-chip layout-chip" data-layout-id="7">7 Card Stream</button>
          <button class="style-chip layout-chip" data-layout-id="8">8 Spotlight</button>
          <button class="style-chip layout-chip" data-layout-id="9">9 Newspaper</button>
          <button class="style-chip layout-chip" data-layout-id="10">10 Command</button>
        </div>
      </div>
      <div class="style-panel-row">
        <span class="style-panel-label">Color</span>
        <div class="style-chips">
          <button class="style-chip color-chip" data-color-id="1">1 Homepage</button>
          <button class="style-chip color-chip" data-color-id="2">2 Dark</button>
          <button class="style-chip color-chip" data-color-id="3">3 Green</button>
          <button class="style-chip color-chip" data-color-id="4">4 Warm Paper</button>
          <button class="style-chip color-chip" data-color-id="5">5 Midnight</button>
          <button class="style-chip color-chip" data-color-id="6">6 Slate</button>
          <button class="style-chip color-chip" data-color-id="7">7 Webex Purple</button>
          <button class="style-chip color-chip" data-color-id="8">8 Minimal</button>
          <button class="style-chip color-chip" data-color-id="9">9 High Contrast</button>
          <button class="style-chip color-chip" data-color-id="10">10 Sunset</button>
        </div>
      </div>
    </div>

    <!-- Wizard shell -->
    <div class="wizard-shell" id="wizard-shell">

      <!-- Step counter + progress bar -->
      <div class="wizard-header" id="wizard-header">
        <div class="wizard-breadcrumb" id="wizard-breadcrumb"></div>
        <div class="wizard-progress-bar" role="progressbar" aria-label="Guide progress">
          <div class="wizard-progress-fill" id="wizard-progress-fill"></div>
        </div>
      </div>

      <!-- Step content area (filled by JS) -->
      <div class="wizard-body" id="wizard-body"></div>

      <!-- Navigation bar -->
      <div class="wizard-nav" id="wizard-nav">
        <button class="wiz-btn wiz-btn-ghost" id="btn-back" type="button" hidden>← Back</button>
        <div class="wizard-nav-right">
          <button class="wiz-btn wiz-btn-primary" id="btn-next" type="button" hidden>Continue →</button>
          <button class="wiz-btn wiz-btn-accent" id="btn-restart" type="button" hidden>Start Over</button>
        </div>
      </div>

    </div>

    <!-- MD view overlay — full rendered doc -->
    <div class="doc-overlay" id="doc-overlay" hidden>
      <div class="doc-overlay-inner">
        <div class="doc-overlay-header">
          <span class="doc-overlay-title" id="doc-overlay-title"></span>
          <button class="doc-close-btn" id="doc-close-btn" type="button" aria-label="Close">✕</button>
        </div>
        <div class="md-content" id="doc-overlay-body"></div>
      </div>
    </div>

    <!-- marked.js from CDN for MD rendering — works in Edge file:// -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <!-- Main script — no type="module" so Edge file:// works -->
    <script src="./app.js"></script>
  </body>
</html>
