name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: tools/netpilot/ccna_automation_github_app
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        working-directory: tools/netpilot/ccna_automation_github_app
        run: ruff check backend/app backend/tests

      - name: Backend tests
        working-directory: tools/netpilot/ccna_automation_github_app
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend-checks:
    name: Frontend Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/netpilot/ccna_automation_github_app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: tools/netpilot/ccna_automation_github_app/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: tools/netpilot/ccna_automation_github_app/frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: tools/netpilot/ccna_automation_github_app/frontend
        run: npm run test

      - name: Frontend build
        working-directory: tools/netpilot/ccna_automation_github_app/frontend
        run: npm run build
