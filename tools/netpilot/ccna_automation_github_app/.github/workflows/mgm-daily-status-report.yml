name: MGM Daily Status Report

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      send_now:
        description: 'Send report immediately'
        required: false
        default: 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      WEBEX_ACCESS_TOKEN: ${{ secrets.WEBEX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Preflight checks
        working-directory: tools/netpilot/ccna_automation_github_app
        run: |
          python --version
          test -f send_reports.py
          if [ -z "$WEBEX_BOT_TOKEN" ]; then
            echo "::error::Missing required secret: WEBEX_BOT_TOKEN"
            exit 1
          fi

      - name: Send status report to subscribers
        working-directory: tools/netpilot/ccna_automation_github_app
        run: |
          set -euo pipefail
          python -u send_reports.py 2>&1 | tee send_report.log

      - name: Upload send-report log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: send-report-log
          path: tools/netpilot/ccna_automation_github_app/send_report.log
