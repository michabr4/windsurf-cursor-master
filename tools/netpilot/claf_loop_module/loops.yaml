loops:
  - id: "interface_health_loop"
    description: "Monitor and remediate interface health"
    triggers:
      - type: "telemetry"
        metric: "interface.utilization"
      - type: "prediction"
        metric: "interface.failure_risk"
    actions:
      - "invoke_arex_flow:reduce_interface_load"
    feedback:
      - "update_ane_state"
      - "update_pte_model"
