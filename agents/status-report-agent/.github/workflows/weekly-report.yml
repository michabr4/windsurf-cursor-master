# Status Report Agent - Weekly Automated Run
# Generates status reports every Monday at 7:00 AM UTC

name: Weekly Status Report

on:
  schedule:
    # Run every Monday at 7:00 AM UTC (adjust for your timezone)
    - cron: '0 7 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      role:
        description: 'Role perspective (SDM, PM, PgM)'
        required: false
        default: 'SDM'
        type: choice
        options:
          - SDM
          - PM
          - PgM
      lookback_days:
        description: 'Number of days to look back'
        required: false
        default: '7'
        type: string
      account_filter:
        description: 'Filter by account name (optional)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      # v5+ / v6+ / upload-artifact v6+ use Node 24 (Node 20 deprecated on runners)
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Status Report Agent
        env:
          # Salesforce
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          
          # ServiceNow
          SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          
          # Azure OpenAI
          LLM_PROVIDER: azure
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o' }}
          
          # Agent config
          AGENT_ROLE: ${{ github.event.inputs.role || 'SDM' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          ACCOUNT_FILTER: ${{ github.event.inputs.account_filter || '' }}
          OUTPUT_DIR: ./output
          OUTPUT_FORMAT: markdown
          WEBEX_ACCESS_TOKEN: ${{ secrets.WEBEX_ACCESS_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        run: |
          set -e
          DELIVER_ARGS=""
          if [ -n "${WEBEX_ACCESS_TOKEN}" ] && [ -n "${WEBEX_ROOM_ID}" ]; then
            DELIVER_ARGS="--deliver webex"
          fi
          if [ -n "${ACCOUNT_FILTER}" ]; then
            python main.py --all --verbose --role "${AGENT_ROLE}" --days "${LOOKBACK_DAYS}" --account "${ACCOUNT_FILTER}" ${DELIVER_ARGS}
          else
            python main.py --all --verbose --role "${AGENT_ROLE}" --days "${LOOKBACK_DAYS}" ${DELIVER_ARGS}
          fi
      
      - name: Upload report artifacts
        uses: actions/upload-artifact@v6
        with:
          name: status-reports-${{ github.run_number }}
          path: output/
          retention-days: 30
      
