version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: serviceflow-sdm-postgres
    environment:
      POSTGRES_DB: serviceflow_sdm
      POSTGRES_USER: serviceflow_admin
      POSTGRES_PASSWORD: serviceflow_admin
    ports:
      - "5432:5432"
    volumes:
      - serviceflow_sdm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow_admin -d serviceflow_sdm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serviceflow_sdm_pgdata:
