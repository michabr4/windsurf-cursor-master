version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: serviceflow-sdm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - serviceflow_sdm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  serviceflow_sdm_redis_data:
